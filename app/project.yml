# Xcode project definition. Generate Knack.xcodeproj with:  xcodegen generate  (brew install xcodegen)
name: Knack
options:
  bundleIdPrefix: com.knack
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

packages:
  KnackCore:
    path: KnackCore

targets:
  Knack:
    type: application
    platform: macOS
    sources:
      - path: Knack
        excludes:
          - "Skills/**/skill.json"
    dependencies:
      - package: KnackCore
    settings:
      base:
        PRODUCT_NAME: Knack
        PRODUCT_BUNDLE_IDENTIFIER: com.knack.app
        INFOPLIST_FILE: Knack/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # Set your Apple team ID here (or pass DEVELOPMENT_TEAM=… to xcodebuild).
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Knack/Knack-Debug.entitlements
          CODE_SIGN_IDENTITY: "-"
          KNACK_CLOUD_URL: "http://localhost:8787"
          KNACK_ALLOW_DEV_SIGN_IN: "YES"
        Release:
          CODE_SIGN_ENTITLEMENTS: Knack/Knack.entitlements
          CODE_SIGN_IDENTITY: "Developer ID Application"
          # Replace with your deployed worker URL (`npm run deploy:staging` in cloud/ prints it).
          KNACK_CLOUD_URL: "https://knack-cloud-staging.example.workers.dev"
          KNACK_ALLOW_DEV_SIGN_IN: "NO"
    postCompileScripts:
      - name: Copy skill manifests
        # Keeps each skill's skill.json in its own folder: Resources/Skills/<Skill>/skill.json
        script: |
          set -euo pipefail
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Skills"
          rm -rf "$dest"
          for manifest in "${SRCROOT}"/Knack/Skills/*/skill.json; do
            folder="$(basename "$(dirname "$manifest")")"
            mkdir -p "$dest/$folder"
            cp "$manifest" "$dest/$folder/skill.json"
          done
        basedOnDependencyAnalysis: false

schemes:
  Knack:
    build:
      targets:
        Knack: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: KnackCore/KnackTests
    archive:
      config: Release
